apiVersion: batch/v1
kind: Job
metadata:
  name: failed-job
  namespace: cron

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: failing-task
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "starting the job"
              echo "something wrong"
              exit 1

