apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob


spec:
  
  schedule: "*/1 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: hello-cron
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  echo "CronJob started at $(date)"
                  echo "Running scheduled task..."
                  sleep 10
                  echo "Scheduled task completed at $(date)"
